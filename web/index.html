<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netflix MS SLA Tracker</title>
<style>
  :root{
    --bg:#0b0b0f; --panel:#15151c; --panel2:#1c1c26; --line:#2a2a36;
    --txt:#f4f4f6; --dim:#9a9aa8; --red:#e50914; --red-dim:#3a1216;
    --green:#28c76f; --amber:#ffb340; --blue:#5aa0ff;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:22px 28px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:linear-gradient(180deg,#141119,#0b0b0f)}
  .logo{width:10px;height:28px;background:var(--red);border-radius:3px;box-shadow:0 0 18px var(--red)}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12px;margin-left:auto}
  .wrap{padding:22px 28px;max-width:1400px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .kpi .n{font-size:26px;font-weight:700}
  .kpi .l{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
  .kpi.accent .n{color:var(--red)}
  .kpi.green .n{color:var(--green)}
  .kpi.amber .n{color:var(--amber)}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--txt);
    padding:10px 14px;border-radius:10px;min-width:260px;flex:1;outline:none}
  input[type=search]:focus{border-color:var(--red)}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    padding:8px 14px;border-radius:999px;cursor:pointer;user-select:none;font-size:12px;font-weight:600}
  .chip.on{background:var(--red-dim);border-color:var(--red);color:#ffd7d9}
  .chip.on.src-slack{background:#12233a;border-color:var(--blue);color:#cfe4ff}
  .chip.on.src-open{background:#3a2c12;border-color:var(--amber);color:#ffe9c2}
  .chip.on.src-done{background:#123020;border-color:var(--green);color:#c2f5d8}
  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  thead th{background:var(--panel2);text-align:left;padding:12px 14px;font-size:11px;
    text-transform:uppercase;letter-spacing:.5px;color:var(--dim);cursor:pointer;white-space:nowrap;position:sticky;top:0}
  thead th:hover{color:var(--txt)}
  tbody td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:#1a1a24}
  .name{max-width:420px}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .b-slack{background:#12233a;color:#8fc0ff}
  .b-sprinklr{background:var(--red-dim);color:#ff9ba0}
  .b-other{background:#26262f;color:var(--dim)}
  .st-open{background:#3a2c12;color:var(--amber)}
  .st-done{background:#123020;color:var(--green)}
  .dur{font-variant-numeric:tabular-nums;color:#dcdce4}
  .muted{color:var(--dim)}
  .tablewrap{overflow-x:auto;border-radius:var(--radius)}
  .foot{color:var(--dim);font-size:12px;margin-top:16px;text-align:center}
  .arrow{font-size:10px;color:var(--red)}
  @media (max-width:640px){.name{max-width:200px}.wrap{padding:14px}}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>Netflix MS SLA Tracker</h1>
  <div class="sub" id="gen"></div>
</header>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search task, assignee...">
    <span class="chip on src-slack" data-f="src" data-v="Slack">Slack</span>
    <span class="chip on" data-f="src" data-v="Sprinklr">Sprinklr</span>
    <span class="chip on" data-f="src" data-v="Other">Other</span>
    <span class="chip on src-open" data-f="st" data-v="open">Open</span>
    <span class="chip on src-done" data-f="st" data-v="done">Done</span>
  </div>
  <div class="tablewrap">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="foot" id="foot"></div>
</div>
<script>
const COLS = [
  {k:"source", t:"Source"},
  {k:"task_name", t:"Task"},
  {k:"assignee", t:"Assignee"},
  {k:"request_arrival_time", t:"Arrived"},
  {k:"Assigned/Emoji initiated", t:"Picked up"},
  {k:"SLA_Assignement", t:"SLA pickup"},
  {k:"Request_fulfil_time", t:"Finished"},
  {k:"SLA_completion", t:"SLA done"},
];
let DATA=[], sortK="request_arrival_time", sortDir=-1;
const flt={src:new Set(["Slack","Sprinklr","Other"]), st:new Set(["open","done"])};

const durMin = s => { if(!s) return null; const m=s.match(/(\d+)h\s*(\d+)m/); return m? (+m[1])*60+(+m[2]) : null; };
const fmtMin = v => { if(v==null) return "–"; const h=Math.floor(v/60),m=Math.round(v%60); return h+"h "+String(m).padStart(2,"0")+"m"; };
const isOpen = r => !r["Request_fulfil_time"].trim();

function kpis(){
  const t=DATA.length, done=DATA.filter(r=>!isOpen(r)).length, open=t-done;
  const asg=DATA.map(r=>durMin(r["SLA_Assignement"])).filter(v=>v!=null);
  const cmp=DATA.map(r=>durMin(r["SLA_completion"])).filter(v=>v!=null);
  const med=a=>{ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); const i=Math.floor(s.length/2); return s.length%2? s[i]:(s[i-1]+s[i])/2; };
  const cards=[
    {n:t,l:"Total requests"},
    {n:done,l:"Completed",c:"green"},
    {n:open,l:"Open",c:"amber"},
    {n:fmtMin(med(asg)),l:"Median pickup SLA",c:"accent"},
    {n:fmtMin(med(cmp)),l:"Median completion SLA",c:"accent"},
  ];
  document.getElementById("kpis").innerHTML = cards.map(c=>
    `<div class="kpi ${c.c||''}"><div class="n">${c.n}</div><div class="l">${c.l}</div></div>`).join("");
}
function head(){
  document.getElementById("head").innerHTML = COLS.map(c=>
    `<th data-k="${c.k}">${c.t} ${sortK===c.k?`<span class="arrow">${sortDir<0?'▼':'▲'}</span>`:''}</th>`).join("");
  document.querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(sortK===k) sortDir*=-1; else {sortK=k;sortDir=-1;} render();
  });
}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function badge(src){const m={Slack:'b-slack',Sprinklr:'b-sprinklr',Other:'b-other'}; return `<span class="badge ${m[src]||'b-other'}">${src}</span>`;}
function render(){
  const q=document.getElementById("q").value.toLowerCase();
  let rows=DATA.filter(r=>{
    if(!flt.src.has(r.source)) return false;
    const st=isOpen(r)?"open":"done"; if(!flt.st.has(st)) return false;
    if(q && !((r.task_name+" "+r.assignee).toLowerCase().includes(q))) return false;
    return true;
  });
  const isDur=sortK.startsWith("SLA"), isTime=sortK.includes("time");
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(isDur){x=durMin(x)??-1;y=durMin(y)??-1;}
    else {x=(x||"").toLowerCase();y=(y||"").toLowerCase();}
    return x<y?-1*sortDir:x>y?1*sortDir:0;
  });
  document.getElementById("body").innerHTML = rows.map(r=>{
    const st=isOpen(r)?'<span class="badge st-open">open</span>':'<span class="badge st-done">done</span>';
    return `<tr>
      <td>${badge(r.source)}</td>
      <td class="name">${esc(r.task_name)}</td>
      <td>${esc(r.assignee)||'<span class="muted">–</span>'}</td>
      <td class="dur muted">${esc(r.request_arrival_time)||'–'}</td>
      <td class="dur muted">${esc(r["Assigned/Emoji initiated"])||'–'}</td>
      <td class="dur">${esc(r.SLA_Assignement)||'–'}</td>
      <td class="dur muted">${esc(r.Request_fulfil_time)||st}</td>
      <td class="dur">${esc(r.SLA_completion)||'–'}</td>
    </tr>`;
  }).join("");
  head();
  document.getElementById("foot").textContent = `Showing ${rows.length} of ${DATA.length} requests`;
}
document.getElementById("q").oninput=render;
document.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
  const f=ch.dataset.f,v=ch.dataset.v;
  if(flt[f].has(v)){flt[f].delete(v);ch.classList.remove("on");}
  else {flt[f].add(v);ch.classList.add("on");}
  kpis();render();
});
fetch("data.json").then(r=>r.json()).then(j=>{
  DATA=j.rows;
  document.getElementById("gen").textContent = "Data as of "+j.generated+"  ·  auto-refreshed every 6h";
  kpis();render();
}).catch(e=>{document.getElementById("body").innerHTML=`<tr><td colspan="8">Could not load data.json: ${e}</td></tr>`;});
</script>
</body>
</html>
