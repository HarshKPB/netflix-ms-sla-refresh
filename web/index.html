<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netflix MS SLA Tracker</title>
<style>
  :root{
    --bg:#0b0b0f; --panel:#15151c; --panel2:#1c1c26; --line:#2a2a36;
    --txt:#f4f4f6; --dim:#9a9aa8; --red:#e50914; --red-dim:#3a1216;
    --green:#28c76f; --amber:#ffb340; --blue:#5aa0ff;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:20px 28px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:linear-gradient(180deg,#141119,#0b0b0f)}
  .logo{height:32px;width:auto;border-radius:4px;display:block}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12px;margin-left:auto;text-align:right}
  .wrap{padding:20px 28px;max-width:1400px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .kpi .n{font-size:26px;font-weight:700}
  .kpi .l{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
  .kpi.accent .n{color:var(--red)}
  .kpi.green .n{color:var(--green)}
  .kpi.amber .n{color:var(--amber)}
  .kpi.blue .n{color:var(--blue)}
  .kpi .d{font-size:12px;font-weight:600;margin-top:6px}
  .kpi .d.up{color:var(--amber)}
  .kpi .d.down{color:var(--green)}
  .kpi .d.flat{color:var(--dim)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:0 0 12px}
  .legend{display:inline-flex;gap:14px;font-size:12px;color:var(--dim);margin-left:10px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .chartwrap{overflow-x:auto}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--txt);
    padding:10px 14px;border-radius:10px;min-width:220px;flex:1;outline:none}
  input[type=search]:focus{border-color:var(--red)}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    padding:8px 13px;border-radius:999px;cursor:pointer;user-select:none;font-size:12px;font-weight:600;white-space:nowrap}
  .chip.on{background:var(--red-dim);border-color:var(--red);color:#ffd7d9}
  .chip.on.src-slack{background:#12233a;border-color:var(--blue);color:#cfe4ff}
  .chip.on.src-open{background:#3a2c12;border-color:var(--amber);color:#ffe9c2}
  .chip.on.src-done{background:#123020;border-color:var(--green);color:#c2f5d8}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:var(--panel);color:var(--dim);border:0;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:600}
  .seg button.on{background:var(--red-dim);color:#ffd7d9}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:9px 14px;
    border-radius:10px;cursor:pointer;font-size:12px;font-weight:600}
  .btn:hover{border-color:var(--red)}
  .spacer{flex:1}
  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  thead th{background:var(--panel2);text-align:left;padding:12px 14px;font-size:11px;
    text-transform:uppercase;letter-spacing:.5px;color:var(--dim);cursor:pointer;white-space:nowrap;position:sticky;top:0}
  thead th:hover{color:var(--txt)}
  tbody td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:#1a1a24}
  .name{max-width:420px}
  .name a{color:var(--txt);text-decoration:none;border-bottom:1px dotted #5a5a68}
  .name a:hover{color:var(--blue);border-bottom-color:var(--blue)}
  .ext{color:var(--dim);font-size:10px;margin-left:5px}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
  .b-slack{background:#12233a;color:#8fc0ff}
  .b-sprinklr{background:var(--red-dim);color:#ff9ba0}
  .st-open{background:#3a2c12;color:var(--amber)}
  .st-done{background:#123020;color:var(--green)}
  .dur{font-variant-numeric:tabular-nums;color:#dcdce4}
  .muted{color:var(--dim)}
  .tablewrap{overflow-x:auto;border-radius:var(--radius)}
  .foot{color:var(--dim);font-size:12px;margin-top:16px;text-align:center}
  .arrow{font-size:10px;color:var(--red)}
  @media (max-width:760px){
    header{padding:14px 16px} .wrap{padding:14px 16px}
    header .sub{margin-left:0;flex-basis:100%;text-align:left}
    .kpis{grid-template-columns:repeat(auto-fit,minmax(46%,1fr));gap:10px}
    .kpi .n{font-size:22px}
    .controls{gap:8px} input[type=search]{min-width:100%;order:-1}
    .name{max-width:180px}
  }
  /* tabs + tickets */
  .tabs{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--line);background:#0d0d13}
  .tabbtn{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--dim);
    padding:13px 16px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.2px}
  .tabbtn:hover{color:var(--txt)}
  .tabbtn.on{color:var(--txt);border-bottom-color:var(--red)}
  .st-await-us{background:var(--red-dim);color:#ff9ba0}
  .st-await-sp{background:#12233a;color:#8fc0ff}
  .st-resolved{background:#123020;color:var(--green)}
  .pri-Urgent{background:#4a1114;color:#ff8a90}
  .pri-High{background:#3a2c12;color:var(--amber)}
  .pri-Normal{background:#1c1c26;color:var(--dim)}
  .age-hot{color:#ff9ba0;font-weight:700}
  .age-warm{color:var(--amber)}
  .cid a{color:var(--blue);text-decoration:none;font-variant-numeric:tabular-nums}
  .cid a:hover{text-decoration:underline}
  .setsel{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 8px;font-size:12px;cursor:pointer}
  .setsel:focus{outline:none;border-color:var(--red)}
  .markdot{color:var(--amber);font-weight:900;margin-left:2px}
  .review{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;font-size:10px;font-weight:700;background:#3a2c12;color:var(--amber);cursor:help;vertical-align:middle}
  @media (max-width:760px){ .tabs{padding:0 10px} .tabbtn{padding:12px 10px;font-size:12px} }
</style>
</head>

  <h1>Netflix MS SLA Tracker</h1>
  <div class="sub" id="gen"></div>
</header>
<nav class="tabs">
  <button class="tabbtn on" data-view="sla">SLA Queue</button>
  <button class="tabbtn" data-view="tickets">Sprinklr Support Tickets</button>
</nav>
<div class="wrap view" id="view-sla">
  <div class="kpis" id="kpis"></div>

  <div class="controls">
    <input type="search" id="q" placeholder="Search task, assignee...">
    <span class="chip on src-slack" data-f="src" data-v="Slack">Slack</span>
    <span class="chip on" data-f="src" data-v="Sprinklr">Sprinklr</span>
    <span class="chip on src-open" data-f="st" data-v="open">Open</span>
    <span class="chip on src-done" data-f="st" data-v="done">Done</span>
    <span class="spacer"></span>
    <span class="seg" id="range">
      <button data-r="7">7d</button><button data-r="30">30d</button>
      <button data-r="90" class="on">90d</button><button data-r="0">All</button>
    </span>
    <button class="btn" id="csv">Export CSV</button>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="foot" id="foot"></div>
</div>

<div class="wrap view" id="view-tickets" hidden>
  <div class="kpis" id="t-kpis"></div>
  <div class="controls">
    <input type="search" id="t-q" placeholder="Search case, title, owner, agent, topic...">
    <span class="chip on" data-f="tst" data-v="Awaiting us">Awaiting us</span>
    <span class="chip on" data-f="tst" data-v="Awaiting Sprinklr">Awaiting Sprinklr</span>
    <span class="chip on" data-f="tst" data-v="Resolved">Resolved</span>
    <span class="spacer"></span>
    <button class="btn" id="t-csv">Export CSV</button>
  </div>
  <div class="tablewrap">
    <table><thead><tr id="t-head"></tr></thead><tbody id="t-body"></tbody></table>
  </div>
  <div class="foot" id="t-foot"></div>
</div>
<script>
const COLS = [
  {k:"source", t:"Source"},
  {k:"task_name", t:"Task"},
  {k:"assignee", t:"Assignee"},
  {k:"request_arrival_time", t:"Arrived"},
  {k:"Assigned/Emoji initiated", t:"Picked up"},
  {k:"SLA_Assignement", t:"SLA pickup"},
  {k:"Request_fulfil_time", t:"Finished"},
  {k:"SLA_completion", t:"SLA done"},
];
let DATA=[], GEN="", sortK="request_arrival_time", sortDir=-1, rangeDays=90;
const DAY=864e5;
const flt={src:new Set(["Slack","Sprinklr"]), st:new Set(["open","done"])};

const refDate = () => GEN ? new Date(GEN+"T23:59:59") : new Date();
const arrivalDate = r => {
  const s=(r.request_arrival_time||"").slice(0,10);
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s+"T00:00:00") : null;
};
const inRange = r => {
  if(!rangeDays) return true;
  const d=arrivalDate(r); if(!d) return false;
  return (refDate()-d) < rangeDays*DAY && (refDate()-d) >= 0;
};
const isOpen = r => !r["Request_fulfil_time"].trim();
const durMin = s => { if(!s) return null; const m=s.match(/(\d+)h\s*(\d+)m/); return m? (+m[1])*60+(+m[2]) : null; };

// Weekly volume for one source, based on arrival time.
// avg = arrivals in the last 8 weeks / 8. An 8-week window is used, not the full
// history, because the Sprinklr feed is a rolling snapshot reaching back years.
// WoW = last 7 days vs the prior 7 days from the data date. null when prior week = 0.
const AVG_WEEKS = 8;
function weekStats(src){
  const ref = refDate();
  const ds = DATA.filter(r=>r.source===src).map(arrivalDate).filter(Boolean);
  if(!ds.length) return {avg:0, wow:null};
  const recent = ds.filter(d=>(ref-d)>=0 && (ref-d)<AVG_WEEKS*7*DAY).length;
  const avg = recent/AVG_WEEKS;
  const l = ds.filter(d=>(ref-d)>=0 && (ref-d)<7*DAY).length;
  const p = ds.filter(d=>(ref-d)>=7*DAY && (ref-d)<14*DAY).length;
  const wow = p>0 ? (l-p)/p*100 : null;
  return {avg, wow};
}
function wowNote(w){
  if(w===null) return {t:"WoW n/a", cls:"flat"};
  const s=w>0?"+":"", cls=Math.abs(w)<0.5?"flat":(w>0?"up":"down");
  const arrow=Math.abs(w)<0.5?"":(w>0?"▲ ":"▼ ");
  return {t:arrow+s+w.toFixed(0)+"% WoW", cls};
}

function kpis(base){
  const t=base.length, done=base.filter(r=>!isOpen(r)).length, open=t-done;
  const sl=weekStats("Slack"), sp=weekStats("Sprinklr");
  const sln=wowNote(sl.wow), spn=wowNote(sp.wow);
  const cards=[
    {n:t,l:"Total requests"},
    {n:done,l:"Completed",c:"green"},
    {n:open,l:"Open",c:"amber"},
    {n:sl.avg.toFixed(1),l:"Slack req / week (8-wk avg)",c:"blue",d:sln},
    {n:sp.avg.toFixed(1),l:"Sprinklr req / week (8-wk avg)",c:"accent",d:spn},
  ];
  document.getElementById("kpis").innerHTML = cards.map(c=>
    `<div class="kpi ${c.c||''}"><div class="n">${c.n}</div><div class="l">${c.l}</div>`+
    (c.d?`<div class="d ${c.d.cls}">${c.d.t}</div>`:``)+`</div>`).join("");
}

function head(){
  document.getElementById("head").innerHTML = COLS.map(c=>
    `<th data-k="${c.k}">${c.t} ${sortK===c.k?`<span class="arrow">${sortDir<0?'▼':'▲'}</span>`:''}</th>`).join("");
  document.querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(sortK===k) sortDir*=-1; else {sortK=k;sortDir=-1;} render();
  });
}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function badge(src){const m={Slack:'b-slack',Sprinklr:'b-sprinklr'}; return `<span class="badge ${m[src]||'b-slack'}">${src}</span>`;}

function currentRows(){
  const q=document.getElementById("q").value.toLowerCase();
  let rows=DATA.filter(inRange).filter(r=>{
    if(!flt.src.has(r.source)) return false;
    const st=isOpen(r)?"open":"done"; if(!flt.st.has(st)) return false;
    if(q && !((r.task_name+" "+r.assignee).toLowerCase().includes(q))) return false;
    return true;
  });
  const isDur=sortK.startsWith("SLA");
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(isDur){x=durMin(x)??-1;y=durMin(y)??-1;}
    else {x=(x||"").toLowerCase();y=(y||"").toLowerCase();}
    return x<y?-1*sortDir:x>y?1*sortDir:0;
  });
  return rows;
}
function render(){
  const base=DATA.filter(inRange);
  kpis(base);
  const rows=currentRows();
  document.getElementById("body").innerHTML = rows.map(r=>{
    const st=isOpen(r)?'<span class="badge st-open">open</span>':'<span class="badge st-done">done</span>';
    return `<tr>
      <td>${badge(r.source)}</td>
      <td class="name">${r.link
        ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.task_name)}</a><span class="ext">&#8599;</span>`
        : esc(r.task_name)}</td>
      <td>${esc(r.assignee)||'<span class="muted">–</span>'}</td>
      <td class="dur muted">${esc(r.request_arrival_time)||'–'}</td>
      <td class="dur muted">${esc(r["Assigned/Emoji initiated"])||'–'}</td>
      <td class="dur">${esc(r.SLA_Assignement)||'–'}</td>
      <td class="dur muted">${esc(r.Request_fulfil_time)||st}</td>
      <td class="dur">${esc(r.SLA_completion)||'–'}</td>
    </tr>`;
  }).join("");
  head();
  document.getElementById("foot").textContent = `Showing ${rows.length} of ${DATA.length} requests`;
}

function toCSV(){
  const rows=currentRows();
  const head=COLS.map(c=>c.k).concat("link");
  const q=s=>`"${(s||"").replace(/"/g,'""')}"`;
  const lines=[head.join(",")].concat(rows.map(r=>head.map(k=>q(r[k])).join(",")));
  const blob=new Blob([lines.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="netflix-sla-"+(GEN||"export")+".csv";
  document.body.appendChild(a); a.click(); a.remove();
}

document.getElementById("q").oninput=render;
document.getElementById("csv").onclick=toCSV;
document.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
  const f=ch.dataset.f,v=ch.dataset.v;
  if(flt[f].has(v)){flt[f].delete(v);ch.classList.remove("on");}
  else {flt[f].add(v);ch.classList.add("on");}
  render();
});
document.querySelectorAll("#range button").forEach(b=>b.onclick=()=>{
  rangeDays=+b.dataset.r;
  document.querySelectorAll("#range button").forEach(x=>x.classList.toggle("on",x===b));
  render();
});
fetch("data.json").then(r=>r.json()).then(j=>{
  DATA=j.rows; GEN=j.generated||"";
  const when=j.generated_at||j.generated||"";
  document.getElementById("gen").textContent = "Updated "+when+" IST  ·  auto-refreshed every 6h";
  render();
}).catch(e=>{document.getElementById("body").innerHTML=`<tr><td colspan="8">Could not load data.json: ${e}</td></tr>`;});

/* ---------- tab switching ---------- */
document.querySelectorAll(".tabbtn").forEach(b=>b.onclick=()=>{
  const v=b.dataset.view;
  document.querySelectorAll(".tabbtn").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".view").forEach(s=>{s.hidden = s.id!=="view-"+v;});
});

/* ---------- Sprinklr support tickets ---------- */
const TCOLS=[
  {k:"case_id",t:"Case"},{k:"title",t:"Title"},{k:"topic",t:"Topic"},
  {k:"priority",t:"Priority"},{k:"status",t:"Status"},{k:"owner",t:"Owner"},
  {k:"agent",t:"Sprinklr agent"},{k:"opened",t:"Opened"},
  {k:"last_update",t:"Last update"},{k:"age_days",t:"Days open"},{k:"mark",t:"Set"},
];
let TDATA=[], TGEN="", tSortK="age_days", tSortDir=-1;
const tflt={tst:new Set(["Awaiting us","Awaiting Sprinklr","Resolved"])};
const PRI_RANK={Urgent:3,High:2,Normal:1};

/* manual per-case status marks. Saved in this browser only (no backend on the static site). */
const OV_KEY="nfx_ticket_overrides_v1";
function ovLoad(){try{return JSON.parse(localStorage.getItem(OV_KEY)||"{}")||{};}catch(e){return {};}}
function ovSave(o){try{localStorage.setItem(OV_KEY,JSON.stringify(o));}catch(e){}}
let OV=ovLoad();
const tkey=r=>r.case_id||("t:"+r.title);
function effStatus(r){const o=OV[tkey(r)];
  if(o==="Completed") return "Resolved";
  if(o==="Open") return r.status==="Resolved"?"Awaiting us":r.status;
  return r.status;}
function isMarked(r){return !!OV[tkey(r)];}

function tCurrent(){
  const q=document.getElementById("t-q").value.toLowerCase();
  let rows=TDATA.filter(r=>{
    if(!tflt.tst.has(effStatus(r))) return false;
    if(q){const hay=(r.case_id+" "+r.title+" "+r.owner+" "+r.agent+" "+r.topic).toLowerCase();
      if(!hay.includes(q)) return false;}
    return true;
  });
  rows.sort((a,b)=>{
    let x=a[tSortK],y=b[tSortK];
    if(tSortK==="age_days"){x=x??-1;y=y??-1;}
    else if(tSortK==="priority"){x=PRI_RANK[x]||0;y=PRI_RANK[y]||0;}
    else if(tSortK==="status"){x=effStatus(a).toLowerCase();y=effStatus(b).toLowerCase();}
    else if(tSortK==="mark"){x=OV[tkey(a)]||"";y=OV[tkey(b)]||"";}
    else {x=(x||"").toString().toLowerCase();y=(y||"").toString().toLowerCase();}
    return x<y?-1*tSortDir:x>y?1*tSortDir:0;
  });
  return rows;
}
function tKpis(){
  const total=TDATA.length;
  const openRows=TDATA.filter(r=>effStatus(r)!=="Resolved");
  const us=TDATA.filter(r=>effStatus(r)==="Awaiting us").length;
  const sp=TDATA.filter(r=>effStatus(r)==="Awaiting Sprinklr").length;
  // Average closure time = mean(last_update - opened) over Resolved cases, shown as days + hours.
  const DAYMS=864e5;
  const durs=TDATA.filter(r=>effStatus(r)==="Resolved").map(r=>{
    const o=Date.parse((r.opened||"")+"T00:00:00"), c=Date.parse((r.last_update||"")+"T00:00:00");
    return (isNaN(o)||isNaN(c)||c<o)?null:(c-o)/DAYMS;
  }).filter(v=>v!=null);
  let avg="n/a";
  if(durs.length){const m=durs.reduce((a,b)=>a+b,0)/durs.length;
    avg=`${Math.floor(m)}d ${Math.round((m-Math.floor(m))*24)}h`;}
  const cards=[
    {n:total,l:"Total cases"},
    {n:openRows.length,l:"Open",c:"amber"},
    {n:us,l:"Awaiting us",c:"accent"},
    {n:sp,l:"Awaiting Sprinklr",c:"blue"},
    {n:avg,l:"Avg closure time",c:"green"},
  ];
  document.getElementById("t-kpis").innerHTML=cards.map(c=>
    `<div class="kpi ${c.c||''}"><div class="n">${c.n}</div><div class="l">${c.l}</div></div>`).join("");
}
function tHead(){
  document.getElementById("t-head").innerHTML=TCOLS.map(c=>
    `<th data-k="${c.k}">${c.t} ${tSortK===c.k?`<span class="arrow">${tSortDir<0?'▼':'▲'}</span>`:''}</th>`).join("");
  document.querySelectorAll("#t-head th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(tSortK===k) tSortDir*=-1; else{tSortK=k;tSortDir=-1;} tRender();
  });
}
function stBadge(s){const m={"Awaiting us":"st-await-us","Awaiting Sprinklr":"st-await-sp","Resolved":"st-resolved"};
  return `<span class="badge ${m[s]||'st-await-us'}">${esc(s)}</span>`;}
function ageCell(d){ if(d==null) return '<span class="muted">–</span>';
  const cls=d>30?'age-hot':(d>14?'age-warm':''); return `<span class="dur ${cls}">${d}d</span>`;}
function setSelect(r){const o=OV[tkey(r)]||"Auto";const k=encodeURIComponent(tkey(r));
  return `<select class="setsel" data-k="${k}">`+
    ["Auto","Completed","Open"].map(v=>`<option value="${v}"${o===v?" selected":""}>${v}</option>`).join("")+
    `</select>`;}
function tRender(){
  tKpis();
  const rows=tCurrent();
  document.getElementById("t-body").innerHTML=rows.map(r=>`<tr>
    <td class="cid">${r.portal_link?`<a href="${esc(r.portal_link)}" target="_blank" rel="noopener">${esc(r.case_id||'link')}</a>`:esc(r.case_id||'–')}</td>
    <td class="name">${r.gmail_link?`<a href="${esc(r.gmail_link)}" target="_blank" rel="noopener">${esc(r.title)}</a><span class="ext">&#8599;</span>`:esc(r.title)}</td>
    <td>${esc(r.topic)}</td>
    <td><span class="badge pri-${esc(r.priority)}">${esc(r.priority)}</span></td>
    <td title="${esc(r.evidence||'')}">${stBadge(effStatus(r))}${isMarked(r)?'<span class="markdot" title="manually set">•</span>':''}${(r.needs_review && !isMarked(r))?'<span class="review" title="low confidence: '+esc(r.evidence||'')+'">review</span>':''}</td>
    <td>${esc(r.owner)||'<span class="muted">–</span>'}</td>
    <td>${esc(r.agent)||'<span class="muted">–</span>'}</td>
    <td class="dur muted">${esc(r.opened)||'–'}</td>
    <td class="dur muted">${esc(r.last_update)||'–'}</td>
    <td>${ageCell(r.age_days)}</td>
    <td>${setSelect(r)}</td>
  </tr>`).join("");
  tHead();
  document.querySelectorAll(".setsel").forEach(sel=>sel.onchange=()=>{
    const k=decodeURIComponent(sel.dataset.k), v=sel.value;
    if(v==="Auto") delete OV[k]; else OV[k]=v;
    ovSave(OV); tRender();
  });
  document.getElementById("t-foot").textContent=
    `Showing ${rows.length} of ${TDATA.length} cases  ·  status = who has the ball from the last human reply (portal link is source of truth)  ·  Set marks save on this browser only`;
}
function tCSV(){
  const rows=tCurrent();
  const head=["case_id","title","topic","priority","inferred_status","effective_status","marked_as","needs_review","evidence","owner","agent","opened","last_update","days_open","days_idle","portal_link","gmail_link"];
  const q=s=>`"${(s==null?"":s).toString().replace(/"/g,'""')}"`;
  const val=(r,k)=> k==="inferred_status"?r.status : k==="effective_status"?effStatus(r) : k==="marked_as"?(OV[tkey(r)]||"") : r[k];
  const lines=[head.join(",")].concat(rows.map(r=>head.map(k=>q(val(r,k))).join(",")));
  const blob=new Blob([lines.join("\n")],{type:"text/csv"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="sprinklr-tickets-"+(TGEN||"export")+".csv";
  document.body.appendChild(a); a.click(); a.remove();
}
document.getElementById("t-q").oninput=tRender;
document.getElementById("t-csv").onclick=tCSV;
document.querySelectorAll("#view-tickets .chip").forEach(ch=>ch.onclick=()=>{
  const f=ch.dataset.f,v=ch.dataset.v;
  if(tflt[f].has(v)){tflt[f].delete(v);ch.classList.remove("on");}
  else{tflt[f].add(v);ch.classList.add("on");}
  tRender();
});
fetch("tickets.json").then(r=>r.json()).then(j=>{
  TDATA=j.rows||[]; TGEN=j.generated||"";
  tRender();
}).catch(e=>{document.getElementById("t-body").innerHTML=`<tr><td colspan="11">Could not load tickets.json: ${e}</td></tr>`;});
</script>
</body>
