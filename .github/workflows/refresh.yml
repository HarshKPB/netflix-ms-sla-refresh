name: SLA refresh

# Laptop independent. Runs in GitHub's cloud on a schedule and on manual dispatch.
# All credentials come from repo secrets, never from the code.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours, UTC
  workflow_dispatch: {}

concurrency:
  group: sla-refresh
  cancel-in-progress: false

# GITHUB_TOKEN needs issue write for the Sprinklr-expiry alert; checkout needs contents read.
permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Write the Sprinklr session file
        env:
          SPRINKLR_SESSION_JSON: ${{ secrets.SPRINKLR_SESSION_JSON }}
        run: |
          printf '%s' "$SPRINKLR_SESSION_JSON" > "$HOME/.netflix_sprinklr_session.json"

      - name: Refresh the SLA sheet
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SLA_SHEET_ID: ${{ secrets.SLA_SHEET_ID }}
          INTAKE_SHEET_ID: ${{ secrets.INTAKE_SHEET_ID }}
          SLACK_WORKSPACE: ${{ secrets.SLACK_WORKSPACE }}
          WEB_DATA_DIR: web
        run: python sla_refresh.py

      # Sync Sprinklr cases into the Asana project (create/update tasks, assignee,
      # status, due date). Formerly a local launchd job that failed whenever the
      # laptop was off or the session expired. Idempotent: it links existing tasks
      # by case id, so a fresh runner with no state file does not create duplicates.
      - name: Sync Sprinklr to Asana
        id: sync
        if: success()
        continue-on-error: true   # a dead Sprinklr session must not fail the whole job
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
        run: python sprinklr_to_asana.py

      # Keep the Sprinklr session alive. The scrape re-saves a refreshed cookie to
      # this file ONLY on a successful scrape (sprinklr_to_asana line 257). Gate on the
      # sync step actually succeeding, so a failed (expired) run does not re-write the
      # stale session back over itself. No-ops safely until GH_PAT is added.
      - name: Persist refreshed Sprinklr session
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          F="$HOME/.netflix_sprinklr_session.json"
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not set, skipping session write-back."; exit 0
          fi
          if [ ! -s "$F" ]; then
            echo "No session file to persist, skipping."; exit 0
          fi
          # Must be valid JSON with cookies, or we would poison the secret.
          if ! python -c "import json,sys; d=json.load(open('$F')); sys.exit(0 if d.get('cookies') else 1)"; then
            echo "Session file not valid JSON with cookies, skipping."; exit 0
          fi
          gh secret set SPRINKLR_SESSION_JSON --repo "$GITHUB_REPOSITORY" < "$F"
          echo "Refreshed Sprinklr session written back to secret."

      # Deploy the web dashboard to Vercel with the fresh data.json. The password gate
      # lives in web/middleware.js and reads DASH_USER / DASH_PASS from the Vercel
      # project env. No-ops safely until the Vercel secrets are added.
      - name: Deploy dashboard to Vercel
        if: success()
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel secrets not set, skipping dashboard deploy."; exit 0
          fi
          if [ ! -s web/data.json ]; then
            echo "web/data.json missing, skipping deploy."; exit 0
          fi
          npm install -g vercel@latest
          cd web
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          echo "Dashboard deployed to Vercel."

      # Alert when the Sprinklr session has expired (dashboard went Slack-only). The
      # session needs a manual SSO + 2FA re-login that cannot be automated, so the
      # sturdy fix is to make the failure loud instead of silent: open one GitHub issue
      # (which emails the repo owner). Deduped: skip if an open issue already exists.
      - name: Alert if Sprinklr session expired
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ok=$(python -c "import json; print(json.load(open('web/data.json')).get('sprinklr_ok', True))" 2>/dev/null || echo "True")
          if [ "$ok" != "False" ]; then
            echo "Sprinklr feed OK, no alert."; exit 0
          fi
          title="Sprinklr session expired: dashboard is Slack-only"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number -q '.[0].number' 2>/dev/null)
          if [ -n "$existing" ]; then
            echo "Alert issue #$existing already open, not duplicating."; exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body "The Sprinklr scrape returned SESSION_EXPIRED, so the SLA dashboard is showing Slack requests only (no Sprinklr rows). This needs a manual re-login. Fix: on the Mac run \`./remint_sprinklr.sh\` (signs into Sprinklr, updates the SPRINKLR_SESSION_JSON secret, re-runs this workflow). Close this issue once Sprinklr rows return. Filed automatically by refresh.yml."
          echo "Opened Sprinklr-expiry alert issue."
